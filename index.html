<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PestureDrawing — Gesture Drawing App</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#fafafa; }
    .setup {
      max-width: 420px; margin: 2rem auto; padding: 1rem 1.25rem; background:#fff;
      border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .setup h2 { text-align:center; margin:0 0 0.5rem; }
    .setup label { display:block; margin-top: 0.75rem; }
    .setup input[type="text"], .setup input[type="number"], .setup select {
      width:100%; padding:0.5rem; margin-top:0.25rem;
    }
    .fullscreen {
      position: fixed; inset: 0; background:#000; display:none;
      justify-content:center; align-items:center; flex-direction:column;
    }
    .fullscreen img { max-width: 100%; max-height: 100%; }
    .session-controls {
      position:absolute; top:1rem; right:1rem; display:flex; gap:0.5rem;
    }
    .session-controls button { font-size:1.1rem; padding:0.45rem 0.65rem; }
    .timer {
      position:absolute; left:1rem; color:#fff; font-size:2rem;
    }
    #imageTimer { top:1rem; }
    #sessionTimer { top:3.5rem; }
    #breakNextLabel {
      position:absolute; top:1rem; left:50%; transform: translateX(-50%);
      color:#bbb; font-size:1.25rem; display:none;
    }
  </style>
  <audio id="bellSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
</head>
<body>

<!-- Break Screen -->
<div class="fullscreen" id="breakScreen" style="background:#111; color:white;">
  <div style="font-size:2rem;">Break Time</div>
  <div id="breakTimer" style="font-size:3rem; margin-top:1rem;">05:00</div>
  <button onclick="skipBreak()" style="margin-top:2rem; padding:1rem 2rem; font-size:1.1rem;">Skip Break</button>
</div>

<!-- Setup Panel -->
<div class="setup" id="setup">
  <h2>Start Drawing Session</h2>

  <div style="display:flex; gap:8px; align-items:center; margin: 0.75rem 0;">
    <button id="loginBtn" type="button">🔐 Login with Pinterest</button>
    <button id="logoutBtn" type="button" style="display:none;">Log out</button>
    <span id="authStatus" style="font-size:0.9rem; color:#555;"></span>
  </div>

  <label>Image Source:</label>
  <label><input type="radio" name="pinterestSource" value="board" checked> Paste Board URL(s)</label>
  <label><input type="radio" name="pinterestSource" value="user"> Use Pinterest Username</label>

  <div id="boardUrlSection" style="margin-top: 0.5rem;">
    <label>Board URL(s) (comma or space separated):</label>
    <input type="text" id="boardUrls" placeholder="https://www.pinterest.com/.../boards/1234567890, https://..." />
  </div>

  <div id="userBoardSection" style="margin-top: 0.5rem; display:none;">
    <label>Pinterest Username:</label>
    <input type="text" id="pinterestUsername" placeholder="e.g. artlover42" />
    <button type="button" onclick="loadUserBoards()">Load Boards</button>

    <label style="margin-top: 0.5rem;">Choose Board(s):</label>
    <select id="userBoards" multiple style="width:100%; padding:0.5rem;"></select>
  </div>

  <!-- Legacy dropdown (still supported as fallback/seed) -->
  <label style="margin-top:0.75rem;">Pinterest Board (preset categories):</label>
  <select id="board">
    <option value="action-poses">action poses</option>
    <option value="architecture">architecture</option>
    <option value="birds">birds</option>
    <option value="canine/canidae">canine/canidae</option>
    <option value="environments">environments</option>
    <option value="fashion">fashion</option>
    <option value="felines">felines</option>
    <option value="fish">fish</option>
    <option value="fundamentals">fundamentals</option>
    <option value="hands-and-extremities">hands and extremities</option>
    <option value="insects">insects</option>
    <option value="mammals">mammals</option>
    <option value="misc.-poses">misc. poses</option>
    <option value="mushrooms, plants, and flowers">mushrooms, plants, and flowers</option>
    <option value="mustelids/rodentia/marsupials">mustelids/rodentia/marsupials</option>
    <option value="portrait">portrait</option>
    <option value="primates">primates</option>
    <option value="reptiles/amphibians">reptiles/amphibians</option>
    <option value="sea-animals">sea animals</option>
    <option value="statuary">statuary</option>
    <option value="trees">trees</option>
    <option value="ungulates">ungulates</option>
    <option value="vehicles">vehicles</option>
  </select>

  <label style="margin-top:0.75rem;">Session Type:</label>
  <label><input type="radio" name="mode" value="standard" checked> Standard</label>
  <label><input type="radio" name="mode" value="class"> Class</label>

  <div id="classSettings" style="display:none; margin-top:0.5rem;">
    <label><input type="checkbox" id="customClassToggle"> Customize Class</label>
    <div id="classPhases" style="margin-top:0.5rem;">
      <div class="class-phase">
        <input type="number" class="phase-count" value="5" style="width:3rem;" /> images for
        <input type="number" class="phase-minutes" value="0" style="width:3rem;" /> min
        <input type="number" class="phase-seconds" value="10" style="width:3rem;" /> sec
        <label><input type="checkbox" class="phase-break" /> break</label>
      </div>
    </div>
    <div id="customControls" style="display:none; margin-top:0.5rem;">
      <button type="button" onclick="addClassPhase()">Add Phase</button>
    </div>
  </div>

  <div id="limitSection" style="margin-top:0.75rem;">
    <label>Session Limit:</label>
    <label><input type="radio" name="limit" value="count" checked> Number of images</label>
    <div id="limitCountOptions" style="display:block; margin-top:0.5rem;">
      <input type="number" id="limitCountValue" value="10"/>
    </div>
    <label><input type="radio" name="limit" value="time"> Stop at time (minutes)</label>
    <label><input type="radio" name="limit" value="endless"> Endless</label>

    <div id="limitTimeOptions" style="display:none; margin-top:0.5rem;">
      <input type="number" id="limitValue" value="10"/>
      <label><input type="checkbox" id="strictTime"> Stop exactly at time</label>
    </div>
  </div>

  <div id="standardOptions" style="margin-top:0.75rem;">
    <label>Duration per Image:</label>
    <div style="display:flex; gap:0.75rem; margin-top:0.25rem;">
      <input type="number" id="durationMin" value="0" placeholder="Minutes" style="flex:1;"/>
      <input type="number" id="durationSec" value="30" placeholder="Seconds" style="flex:1;"/>
    </div>

    <label style="margin-top:0.5rem;">Bell Times (seconds, comma-separated):</label>
    <input type="text" id="bellTimes" value="60,10,5"/>

    <label style="margin-top:0.5rem;"><input type="checkbox" id="breaks" checked> Enable breaks</label>
    <label>Break After (minutes):</label>
    <input type="number" id="breakAfter" value="20"/>
    <label>Break Duration (minutes):</label>
    <input type="number" id="breakDuration" value="5"/>
  </div>

  <button onclick="startSession()" style="margin-top:1rem;">Start Drawing</button>
</div>

<!-- Image Viewer -->
<div class="fullscreen" id="viewer">
  <div class="timer" id="imageTimer">00:00</div>
  <div class="timer" id="sessionTimer">00:00</div>
  <div style="position:absolute; bottom:1rem; left:1rem;">
    <button onclick="toggleImageTimer()">Toggle Image Timer</button>
    <button onclick="toggleSessionTimer()">Toggle Session Timer</button>
  </div>
  <div id="breakNextLabel">Break next</div>
  <div class="session-controls">
    <button onclick="prevImage()">⏮️</button>
    <button onclick="togglePause()" id="pauseBtn">⏸️</button>
    <button onclick="nextImage()">⏭️</button>
    <button onclick="endSession()">⏹️</button>
  </div>
  <img id="currentImage" src=""/>
</div>

<!-- Session Finished Screen (Option B) -->
<div class="fullscreen" id="finishedScreen" style="background:#222; color:#fff;">
  <div style="font-size:2rem;">Session finished! Awesome work! 😄</div>
  <button onclick="backToSetup()" style="margin-top:2rem; padding:1rem 2rem; font-size:1.1rem;">Back to Setup</button>
</div>

<script>
/* ================== Global State ================== */
let imageList = [], currentIndex = 0, sessionTimer = null, isPaused = false;
let imageDuration = 30, remaining = 0, elapsedTime = 0;
let limitMode = "count", limitValue = 10, strictTime = false;
let inBreak = false, breakTimeRemaining = 0, breaksTaken = 0;
let breakEnabled = false, breakAfter = 20, breakDuration = 5;
let bellTimes = [], bellFiredThisImage = new Set(), bellFiredThisBreak = new Set();
let sessionMode = "standard", classImageSchedule = [];
let imageDisplayIndex = 0, sessionRemaining = null;
let showImageTimer = true, showSessionTimer = true;

/* ================== OAuth + API Helpers ================== */
const API_BASE = '/api';
const LS_TOKEN_KEY = 'pd_access_token';

document.addEventListener('DOMContentLoaded', () => {
  // Source toggles
  document.querySelectorAll('input[name="pinterestSource"]').forEach(r => r.addEventListener('change', onSourceChange));
  onSourceChange();

  // Session type toggles
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
    const isClass = document.querySelector('input[name="mode"]:checked').value === "class";
    document.getElementById("classSettings").style.display = isClass ? "block" : "none";
    document.getElementById("limitSection").style.display = isClass ? "none" : "block";
    document.getElementById("standardOptions").style.display = isClass ? "none" : "block";
  }));
  document.getElementById("customClassToggle").addEventListener("change", (e) => {
    document.getElementById("customControls").style.display = e.target.checked ? "block" : "none";
  });

  // Limit toggles
  document.querySelectorAll('input[name="limit"]').forEach(r => r.addEventListener('change', () => {
    const v = document.querySelector('input[name="limit"]:checked').value;
    document.getElementById("limitTimeOptions").style.display = v === "time" ? "block" : "none";
    document.getElementById("limitCountOptions").style.display = v === "count" ? "block" : "none";
  }));

  // OAuth buttons
  document.getElementById('loginBtn').addEventListener('click', startLogin);
  document.getElementById('logoutBtn').addEventListener('click', logout);

  // Handle OAuth callback if present
  maybeHandleCallback();

  // Initial UI state
  updateAuthUI();
});

/* ========== OAuth Start/Exchange ========== */
async function startLogin() {
  try {
    const r = await fetch(`${API_BASE}/auth/start`, { credentials: 'include' });
    const { url } = await r.json();
    if (!url) throw new Error('No auth URL');
    window.location = url;
  } catch {
    setAuthStatus('Login failed to start.');
  }
}

async function maybeHandleCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  if (error) {
    setAuthStatus('Authorization cancelled or denied.');
    clearQuery();
    return;
  }
  if (!code || !state) return;

  try {
    const r = await fetch(`${API_BASE}/auth/exchange`, {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code, state })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(data));
    if (data && data.access_token) {
      localStorage.setItem(LS_TOKEN_KEY, data.access_token);
      setAuthStatus('Logged in.');
    } else {
      throw new Error('No access_token in response');
    }
  } catch {
    setAuthStatus('Token exchange failed.');
  } finally {
    clearQuery();
    updateAuthUI();
  }
}

/* ========== Boards & Pins via backend proxy ========== */
function getToken(){ return localStorage.getItem(LS_TOKEN_KEY); }
function isAuthed(){ return !!getToken(); }
function logout(){ localStorage.removeItem(LS_TOKEN_KEY); updateAuthUI(); setAuthStatus('Logged out.'); }
function setAuthStatus(msg){ const el = document.getElementById('authStatus'); if (el) el.textContent = msg || ''; }
function clearQuery(){ const u = new URL(location.href); u.search = ''; history.replaceState({}, '', u.toString()); }

async function loadUserBoards() {
  const token = getToken();
  if (!token) { setAuthStatus('Please log in first.'); return; }
  const sel = document.getElementById('userBoards');
  sel.innerHTML = '';
  try {
    const r = await fetch(`${API_BASE}/boards`, { headers: { Authorization: `Bearer ${token}` }});
    const data = await r.json();
    const items = data.items || data.data || data.boards || [];
    for (const b of items) {
      const opt = document.createElement('option');
      opt.value = b.id || b.owner?.id || b.name;
      opt.textContent = b.name || b.title || b.id;
      sel.appendChild(opt);
    }
    if (!sel.options.length) setAuthStatus('No boards found.');
  } catch {
    setAuthStatus('Failed to load boards.');
  }
}

async function getPinsForBoard(boardId) {
  const token = getToken();
  if (!token) throw new Error('Not logged in');
  const r = await fetch(`${API_BASE}/boards/${encodeURIComponent(boardId)}/pins`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await r.json();
  const items = data.items || data.data || [];
  const urls = [];
  for (const pin of items) {
    const img = pin.media?.images?.originals?.url
            || pin.media?.images?.['600x']?.url
            || pin.link
            || pin.image_url;
    if (img) urls.push(img);
  }
  return urls;
}

/* ================== UI helpers ================== */
function onSourceChange() {
  const val = document.querySelector('input[name="pinterestSource"]:checked')?.value || 'board';
  document.getElementById('userBoardSection').style.display = val === 'user' ? 'block' : 'none';
  document.getElementById('boardUrlSection').style.display = val === 'user' ? 'none' : 'block';
}

function updateAuthUI() {
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const status = document.getElementById('authStatus');
  if (isAuthed()) {
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    status.textContent = 'Ready';
  } else {
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    status.textContent = 'Not logged in';
  }
}

function addClassPhase() {
  const container = document.getElementById("classPhases");
  const div = document.createElement("div");
  div.className = "class-phase";
  div.innerHTML = `
    <input type="number" class="phase-count" value="1" style="width:3rem;" /> images for
    <input type="number" class="phase-minutes" value="0" style="width:3rem;" /> min
    <input type="number" class="phase-seconds" value="30" style="width:3rem;" /> sec
    <label><input type="checkbox" class="phase-break" /> break</label>
  `;
  container.appendChild(div);
}

/* ================== Session Wiring ================== */
function uniq(arr){ const s=new Set(); const out=[]; for(const x of arr){ if(!s.has(x)){ s.add(x); out.push(x);} } return out; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

async function startSession() {
  try {
    // Build list of board IDs from UI
    const sourceType = document.querySelector('input[name="pinterestSource"]:checked')?.value || 'board';
    let selectedBoards = [];
    if (sourceType === 'user') {
      const options = document.getElementById('userBoards')?.selectedOptions || [];
      selectedBoards = Array.from(options).map(o => o.value).filter(Boolean);
    } else {
      const raw = (document.getElementById('boardUrls')?.value || '').trim();
      const parts = raw.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      for (const p of parts) {
        const m = p.match(/boards\/(\d+)/); // extract numeric ID if URL form
        selectedBoards.push(m ? m[1] : p);
      }
    }
    if (!selectedBoards.length) {
      const legacy = document.getElementById('board')?.value;
      if (legacy) selectedBoards = [legacy];
    }

    // Fetch pins from selected boards
    let urls = [];
    for (const bId of selectedBoards) {
      try { urls.push(...await getPinsForBoard(bId)); }
      catch (e) { console.warn('Board failed', bId, e); }
    }

    // Fallback to local manifest.json if none fetched
    if (!urls.length) {
      try {
        const r = await fetch('./manifest.json'); const manifest = await r.json();
        const chosen = document.getElementById('board')?.value;
        const all = [];
        for (const section of manifest) {
          if (!chosen || section.name === chosen) all.push(...section.images);
        }
        urls = all;
      } catch {}
    }

    imageList = shuffle(uniq(urls));
    if (!imageList.length) { alert('No images found. Please log in and select at least one board.'); return; }

    // Read session settings
    sessionMode = document.querySelector('input[name="mode"]:checked')?.value || 'standard';
    const min = parseInt(document.getElementById('durationMin')?.value || '0', 10);
    const sec = parseInt(document.getElementById('durationSec')?.value || '30', 10);
    imageDuration = Math.max(1, (min*60) + sec | 0);

    const bellStr = (document.getElementById('bellTimes')?.value || '').trim();
    bellTimes = bellStr ? bellStr.split(',').map(s=>parseInt(s,10)).filter(n=>!isNaN(n)&&n>0).sort((a,b)=>b-a) : [];
    bellFiredThisImage = new Set();

    breakEnabled = !!document.getElementById('breaks')?.checked;
    breakAfter = parseInt(document.getElementById('breakAfter')?.value || '20', 10);
    breakDuration = parseInt(document.getElementById('breakDuration')?.value || '5', 10);
    breaksTaken = 0;

    limitMode = document.querySelector('input[name="limit"]:checked')?.value || 'count';
    if (limitMode === 'time') {
      strictTime = !!document.getElementById('strictTime')?.checked;
      const mins = parseInt(document.getElementById('limitValue')?.value || '10', 10);
      limitValue = Math.max(1, mins);
      sessionRemaining = limitValue * 60;
    } else if (limitMode === 'count') {
      strictTime = false;
      const cnt = parseInt(document.getElementById('limitCountValue')?.value || '10', 10);
      limitValue = Math.max(1, cnt);
      sessionRemaining = null;
    } else {
      strictTime = false; limitValue = Infinity; sessionRemaining = null;
    }

    // Show viewer and start
    currentIndex = 0; imageDisplayIndex = 0; isPaused = false; inBreak = false;
    remaining = imageDuration; elapsedTime = 0;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('finishedScreen').style.display = 'none';
    const viewer = document.getElementById('viewer'); viewer.style.display = 'flex';
    document.getElementById('breakScreen').style.display = 'none';
    document.getElementById('pauseBtn').textContent = '⏸️';

    showImage(currentIndex);
    startTickLoop();
  } catch (e) {
    console.error(e);
    alert('Could not start session. Please try again.');
  }
}

/* ================== Playback & Timers ================== */
function showImage(i) {
  const img = document.getElementById('currentImage');
  if (!img) return;
  img.src = imageList[i % imageList.length];
  bellFiredThisImage = new Set();
}

function startTickLoop() {
  clearInterval(sessionTimer);
  sessionTimer = setInterval(() => {
    if (isPaused) return;

    if (inBreak) {
      breakTimeRemaining -= 1;
      updateBreakTimerLabel();
      if (breakTimeRemaining <= 0) endBreak();
      return;
    }

    remaining -= 1;
    updateImageTimerLabel();
    fireBells();

    if (remaining <= 0) nextImage();

    if (sessionRemaining != null) {
      sessionRemaining -= 1;
      updateSessionTimerLabel();
      if (sessionRemaining <= 0 && strictTime) endSession();
    } else {
      updateSessionTimerLabel(); // show elapsed time
      elapsedTime = (elapsedTime || 0) + 1;
    }
  }, 1000);
}

function nextImage() {
  currentIndex = (currentIndex + 1) % imageList.length;
  imageDisplayIndex += 1;

  if (breakEnabled) {
    const minutesShown = Math.floor((imageDisplayIndex * imageDuration) / 60);
    const lbl = document.getElementById('breakNextLabel');
    if (lbl) lbl.style.display = (minutesShown + imageDuration/60 >= breakAfter) ? 'block' : 'none';
    if (minutesShown >= breakAfter) { startBreak(); return; }
  }

  if (limitMode === 'count' && imageDisplayIndex >= limitValue) { endSession(); return; }

  remaining = imageDuration;
  showImage(currentIndex);
}

function prevImage() {
  currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
  remaining = imageDuration;
  showImage(currentIndex);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  if (btn) btn.textContent = isPaused ? '▶️' : '⏸️';
}

function endSession() {
  clearInterval(sessionTimer);
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('breakScreen').style.display = 'none';
  document.getElementById('finishedScreen').style.display = 'flex'; // Option B
}

function startBreak() {
  inBreak = true; breaksTaken += 1;
  breakTimeRemaining = Math.max(1, breakDuration) * 60;
  document.getElementById('viewer').style.display = 'none';
  const bs = document.getElementById('breakScreen'); bs.style.display = 'flex';
  document.getElementById('breakNextLabel').style.display = 'none';
  bellFiredThisBreak = new Set();
  updateBreakTimerLabel();
}

function endBreak() {
  inBreak = false;
  document.getElementById('breakScreen').style.display = 'none';
  document.getElementById('viewer').style.display = 'flex';
  imageDisplayIndex = 0; // reset counter towards next break window
  remaining = imageDuration;
  showImage(currentIndex);
}

function skipBreak(){ endBreak(); }

function updateImageTimerLabel() {
  const el = document.getElementById('imageTimer'); if (!el) return;
  const m = Math.floor(Math.max(0, remaining)/60);
  const s = Math.max(0, remaining) % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.style.display = showImageTimer ? 'block' : 'none';
}

function updateSessionTimerLabel() {
  const el = document.getElementById('sessionTimer'); if (!el) return;
  let seconds;
  if (sessionRemaining != null) {
    seconds = Math.max(0, sessionRemaining);
  } else {
    seconds = elapsedTime || 0;
  }
  const m = Math.floor(seconds/60);
  const s = seconds % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.style.display = showSessionTimer ? 'block' : 'none';
}

function fireBells() {
  if (!bellTimes?.length) return;
  const t = remaining;
  const bell = document.getElementById('bellSound');
  for (const mark of bellTimes) {
    if (t === mark && !bellFiredThisImage.has(mark)) {
      try { bell?.play?.(); } catch {}
      bellFiredThisImage.add(mark);
    }
  }
}

function toggleImageTimer(){ showImageTimer = !showImageTimer; updateImageTimerLabel(); }
function toggleSessionTimer(){ showSessionTimer = !showSessionTimer; updateSessionTimerLabel(); }

/* Finished screen -> back to setup */
function backToSetup() {
  document.getElementById('finishedScreen').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
}
</script>
</body>
</html>
